<style>
:root{
  --paper:#ECEEE7; --paper2:#E1E4DA; --paper3:#F6F7F3;
  --ink:#0F140E; --ink2:#5A6155; --ink3:#8B9184;
  --canal:#0A6A70; --canal-d:#074B50;
  --target:#C41E5A;
  --lote:#8A9A5B; --line:#C6CBBD;
  --ok:#2E7D32; --warn:#B26A00;
  --mono:ui-monospace,"SF Mono","Roboto Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{
  background:var(--paper); color:var(--ink); font-family:var(--sans);
  font-size:16px; line-height:1.35; overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}

/* ---- micro label: instrument panel vernacular ---- */
.lbl{
  font-family:var(--sans); font-size:10px; font-weight:700;
  letter-spacing:.14em; text-transform:uppercase; color:var(--ink3);
}

/* ---- app frame ---- */
#app{display:flex;flex-direction:column;height:100dvh}
header{
  flex:0 0 auto; background:var(--canal); color:#fff;
  padding:calc(var(--safe-t) + 9px) 14px 9px;
  display:flex;align-items:center;gap:10px;
}
header .brand{font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.16em}
header .where{
  margin-left:auto;text-align:right;font-family:var(--mono);font-size:11px;
  color:#BFE3E4;max-width:62%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap
}
main{flex:1 1 auto;position:relative;overflow:hidden}
.view{position:absolute;inset:0;display:none;overflow-y:auto;-webkit-overflow-scrolling:touch}
.view.on{display:block}

/* ---- bottom nav ---- */
nav{
  flex:0 0 auto;display:grid;grid-template-columns:repeat(3,1fr);
  background:var(--paper3);border-top:1px solid var(--line);
  padding-bottom:var(--safe-b);
}
nav button{
  padding:10px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:4px;
  color:var(--ink3);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  border-top:2px solid transparent;margin-top:-1px;
}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}
nav button.on{color:var(--canal);border-top-color:var(--canal)}

/* =================== IR (navegar) =================== */
#ir{padding:14px 16px 24px;gap:14px;min-height:100%}
#ir.on{display:flex;flex-direction:column}
.pick{
  width:100%;background:var(--paper3);border:1px solid var(--line);border-radius:2px;
  padding:11px 13px;display:flex;align-items:center;gap:11px;text-align:left;
}
.pick .tgt{flex:1;min-width:0}
.pick .tgt b{display:block;font-size:17px;font-weight:650;line-height:1.2;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick .tgt span{display:block;font-family:var(--mono);font-size:11px;color:var(--ink2);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick .chev{color:var(--ink3);font-size:20px}

/* --- SIGNATURE: dial --- */
.dialwrap{position:relative;width:min(78vw,300px);aspect-ratio:1;margin:2px auto 0}
.dialwrap svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.dialwrap .index{position:absolute;left:50%;top:-11px;transform:translateX(-50%);
  width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;
  border-top:10px solid var(--ink)}
#ring{transition:transform .16s linear;transform-origin:50% 50%}
#needle{transition:transform .16s linear;transform-origin:50% 50%}
.est{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;
  padding:3px 9px;border-radius:99px;letter-spacing:.02em}
.estsel{display:flex;gap:7px;flex-wrap:wrap;margin:7px 0 4px}
.estsel button{flex:1;min-width:calc(50% - 4px);border:1.5px solid var(--linea);
  background:transparent;border-radius:11px;padding:11px 8px;font-size:13px;
  font-weight:600;color:var(--tinta)}
.estsel button.on{color:#fff;border-color:transparent}
.visita{border-left:3px solid var(--linea);padding:9px 0 9px 11px;margin:9px 0}
.visita .cab{display:flex;justify-content:space-between;align-items:center;gap:8px}
.visita .cu{font-size:11px;opacity:.6}
.visita p{margin:6px 0 0;font-size:13.5px;white-space:pre-wrap}
.fotos{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.fotos img{width:74px;height:74px;object-fit:cover;border-radius:9px;border:1px solid var(--linea)}
.visor{position:fixed;inset:0;z-index:90;background:rgba(8,10,7,.95);display:flex;
  align-items:center;justify-content:center;padding:14px}
.visor img{max-width:100%;max-height:88vh;border-radius:10px}
.marca{position:absolute;top:0;right:0;background:var(--acento);color:#fff;font-size:9px;
  font-weight:800;padding:2px 5px;border-radius:0 0 0 7px}
.brand i{font-style:normal;font-size:10px;font-weight:600;opacity:.55;
  margin-left:5px;letter-spacing:.04em;vertical-align:super}
.diag{font:12px ui-monospace,Menlo,Consolas,monospace;background:#11150F;color:#D7DCCE;
  border-radius:10px;padding:10px 12px;line-height:1.7;white-space:pre-wrap;
  word-break:break-all;margin:7px 0}
.diag b{color:#8FD3A6;font-weight:600}
.diag .mal{color:#FF9A8B}
.aviso-act{position:fixed;left:12px;right:12px;bottom:78px;z-index:60;background:#0A6A70;
  color:#fff;border-radius:13px;padding:12px 14px;display:flex;gap:10px;align-items:center;
  box-shadow:0 6px 22px rgba(0,0,0,.3)}
.aviso-act b{flex:1;font-size:14px}
.aviso-act button{background:#fff;color:#0A6A70;border:0;border-radius:9px;
  padding:8px 14px;font-weight:700;font-size:13px}
.ruta{background:#0A6A70;color:#fff;border-radius:14px;padding:12px 14px;margin:10px 0}
.ruta.apagado{background:#5A6155}
.prom{text-align:center;padding:6px 0 2px}
.prom .big{font:700 40px/1 var(--mono,ui-monospace),monospace;color:var(--acento)}
.prom .lbl2{font-size:12px;opacity:.6;margin-top:3px}
.barra{height:7px;border-radius:99px;background:var(--linea);overflow:hidden;margin:14px 0 4px}
.barra i{display:block;height:100%;background:var(--acento);width:0;transition:width .4s linear}
.calidad{display:flex;gap:8px;margin-top:13px}
.calidad div{flex:1;text-align:center;background:var(--suave,#F1F3EC);border-radius:10px;padding:9px 4px}
.calidad b{display:block;font:600 15px var(--mono,ui-monospace),monospace}
.calidad span{font-size:10.5px;opacity:.62;letter-spacing:.02em}
.ruta-top{display:flex;align-items:center;gap:12px}
.ruta-giro{font-size:30px;line-height:1;min-width:34px;text-align:center}
.ruta-top b{display:block;font-size:16px}
.ruta-top span#rutaEn{font-size:13px;opacity:.82}
.ruta-pie{display:flex;justify-content:space-between;margin-top:8px;
  padding-top:8px;border-top:1px solid rgba(255,255,255,.22);font-size:12px;opacity:.85}
.readout{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;pointer-events:none;
}
.dist{
  font-family:var(--mono);font-weight:700;font-size:clamp(38px,13vw,60px);
  line-height:.92;letter-spacing:-.03em;font-variant-numeric:tabular-nums;
}
.dist small{font-size:.36em;font-weight:600;letter-spacing:.06em;margin-left:.14em;color:var(--ink2)}
.brg{font-family:var(--mono);font-size:12px;color:var(--ink2);margin-top:7px;letter-spacing:.06em}

.strip{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:2px;overflow:hidden}
.strip>div{background:var(--paper3);padding:8px 11px}
.strip b{display:block;font-family:var(--mono);font-size:14px;font-weight:700;margin-top:2px;
  font-variant-numeric:tabular-nums;white-space:pre-line;line-height:1.3}
.gps{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--ink2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink3);flex:0 0 auto}
.dot.good{background:var(--ok)} .dot.mid{background:var(--warn)} .dot.bad{background:var(--target)}
.hint{font-size:12px;color:var(--ink2);text-align:center;line-height:1.45}
.empty{text-align:center;padding:44px 22px;color:var(--ink2)}
.empty h2{font-size:17px;font-weight:650;color:var(--ink);margin:0 0 6px}
.empty p{font-size:13px;margin:0 0 16px;line-height:1.5}

/* =================== botones =================== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 16px;border-radius:2px;font-size:14px;font-weight:650;
  background:var(--canal);color:#fff;letter-spacing:.01em;
}
.btn:active{background:var(--canal-d)}
.btn.ghost{background:transparent;color:var(--canal);border:1px solid var(--canal)}
.btn.grey{background:var(--paper2);color:var(--ink)}
.btn.danger{background:var(--target);color:#fff}
.btn.wide{width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}
.row{display:flex;gap:9px}
.row>*{flex:1}

/* =================== MAPA =================== */
#mapa{padding:0}
#map{position:absolute;inset:0;background:var(--paper);z-index:0}
.leaflet-container{background:var(--paper);font-family:var(--sans)}
.mapbtns{position:absolute;left:11px;bottom:14px;z-index:600;display:flex;flex-direction:column;gap:8px}
.mapbtns button{
  width:46px;height:46px;border-radius:2px;background:var(--paper3);
  border:1px solid var(--line);display:grid;place-items:center;color:var(--canal);
  box-shadow:0 1px 3px rgba(15,20,14,.18)
}
.mapbtns button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.mapbtns button.act{background:var(--canal);color:#fff;border-color:var(--canal)}
.pin-label{
  font-family:var(--mono);font-size:10px;font-weight:700;color:var(--ink);
  background:rgba(246,247,243,.82);padding:1px 3px;white-space:nowrap;border-radius:1px;
}
.finca-label{font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:#5C6B36;white-space:nowrap;text-shadow:0 0 3px var(--paper)}

/* =================== PUNTOS =================== */
#puntos{padding:0 0 30px}
.search{position:sticky;top:0;z-index:5;background:var(--paper);padding:11px 14px 9px;
  border-bottom:1px solid var(--line)}
.search input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:2px;
  background:var(--paper3);font-size:15px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:9px 14px 3px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:6px 11px;border:1px solid var(--line);border-radius:999px;
  background:var(--paper3);font-size:12px;font-weight:600;color:var(--ink2);white-space:nowrap}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.grp{padding:16px 14px 5px;font-family:var(--sans);font-size:10px;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.item{display:flex;align-items:center;gap:11px;padding:12px 14px;border-bottom:1px solid var(--line);
  background:var(--paper)}
.item .ic{width:30px;height:30px;border-radius:2px;display:grid;place-items:center;flex:0 0 auto;
  font-family:var(--mono);font-size:12px;font-weight:700;color:#fff}
.item .tx{flex:1;min-width:0}
.item .tx b{display:block;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .tx span{display:block;font-family:var(--mono);font-size:11px;color:var(--ink2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .d{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--canal);
  font-variant-numeric:tabular-nums;flex:0 0 auto}
.fab{position:fixed;right:14px;bottom:calc(76px + var(--safe-b));z-index:900;
  width:56px;height:56px;border-radius:2px;background:var(--target);color:#fff;
  display:grid;place-items:center;box-shadow:0 3px 10px rgba(196,30,90,.36)}
.fab svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2}

/* =================== hoja modal =================== */
.sheet{position:fixed;inset:0;z-index:2000;display:none}
.sheet.on{display:block}
.sheet .scrim{position:absolute;inset:0;background:rgba(15,20,14,.44)}
.sheet .card{
  position:absolute;left:0;right:0;bottom:0;max-height:92dvh;overflow-y:auto;
  background:var(--paper);border-top:3px solid var(--canal);
  padding:16px 16px calc(20px + var(--safe-b));
  animation:up .2s cubic-bezier(.2,.8,.3,1);
}
@keyframes up{from{transform:translateY(14px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){
  .sheet .card{animation:none} #ring,#needle{transition:none}
}
.sheet h3{margin:0 0 14px;font-size:18px;font-weight:650}
.f{margin-bottom:13px}
.f label{display:block;margin-bottom:5px}
.f input,.f select,.f textarea{
  width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:2px;
  background:var(--paper3);font-size:16px
}
.f textarea{min-height:64px;resize:vertical;font-size:15px}
.f .note{font-size:11px;color:var(--ink2);margin-top:5px;line-height:1.4}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.pickrow{width:100%;text-align:left;padding:13px 14px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:11px}
.pickrow b{font-weight:600;font-size:15px}
.pickrow span{font-family:var(--mono);font-size:11px;color:var(--ink2);margin-left:auto;
  font-variant-numeric:tabular-nums}
.toast{
  position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:2px;
  font-size:13px;z-index:2400;max-width:88vw;text-align:center;
  opacity:0;pointer-events:none;transition:opacity .2s
}
.toast.on{opacity:1}
hr.sep{border:0;border-top:1px solid var(--line);margin:18px 0}
.mini{font-size:12px;color:var(--ink2);line-height:1.5}
.mini code{font-family:var(--mono);font-size:11px;background:var(--paper2);padding:1px 4px}
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="brand">RUMBO<i id="vTag">v7</i></span>
    <span class="where" id="where">buscando señal…</span>
  </header>

  <main>
    <!-- ============ IR ============ -->
    <section class="view on" id="ir">
      <button class="pick" id="pickBtn">
        <div class="tgt">
          <b id="tgtName">Sin destino</b>
          <span id="tgtSub">Toca para elegir un punto</span>
        </div>
        <span class="chev">›</span>
      </button>

      <div class="dialwrap" id="dialwrap"><div class="index" aria-hidden="true"></div>
        <svg viewBox="0 0 200 200" aria-hidden="true">
          <circle cx="100" cy="100" r="94" fill="#F6F7F3" stroke="#C6CBBD" stroke-width="1"/>
          <circle id="accRing" cx="100" cy="100" r="18" fill="rgba(10,106,112,.09)" stroke="rgba(10,106,112,.30)" stroke-width="1" stroke-dasharray="3 3"/>
          <g id="ring"></g>
          <g id="needle">
            <path d="M100 8 L108.5 30 L100 25 L91.5 30 Z" fill="#C41E5A"/>
            <rect x="98.7" y="28" width="2.6" height="19" fill="#C41E5A" opacity=".5"/>
          </g>
        </svg>
        <div class="readout">
          <div class="dist" id="dist">—<small>m</small></div>
          <div class="brg" id="brg">rumbo —</div>
        </div>
      </div>

      <div class="strip">
        <div><span class="lbl">Tu posición</span><b id="myPos">—</b></div>
        <div><span class="lbl">Punto</span><b id="tgtPos">—</b></div>
      </div>

      <div class="gps">
        <span class="dot" id="gpsDot"></span>
        <span id="gpsTxt">Toca "Activar ubicación"</span>
      </div>
      <div class="row" id="filaPermiso">
        <button class="btn wide" id="btnGPS">Activar ubicación</button>
      </div>

      <div class="ruta" id="panelRuta" style="display:none">
        <div class="ruta-top">
          <span class="ruta-giro" id="rutaGiro">↑</span>
          <div>
            <b id="rutaPaso">Siga derecho</b>
            <span id="rutaEn">—</span>
          </div>
        </div>
        <div class="ruta-pie">
          <span id="rutaVia">—</span>
          <span id="rutaTotal">—</span>
        </div>
      </div>

      <p class="hint" id="hint">Apunta el celular hacia adelante y camina. La aguja roja marca el punto; el número, los metros que faltan.</p>

      <div class="row">
        <button class="btn ghost" id="btnVerMapa">Ver en el mapa</button>
        <button class="btn grey" id="btnCalib">Calibrar brújula</button>
      </div>
    </section>

    <!-- ============ MAPA ============ -->
    <section class="view" id="mapa">
      <div id="map"></div>
      <div class="mapbtns">
        <button id="mCenter" title="Centrar en mí"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/></svg></button>
        <button id="mLabels" class="act" title="Nombres"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h10M4 17h7"/></svg></button>
        <button id="mFit" title="Ver todo"><svg viewBox="0 0 24 24"><path d="M3 9V3h6M21 9V3h-6M3 15v6h6M21 15v6h-6"/></svg></button>
        <button id="mBase" title="Fondo del mapa"><svg viewBox="0 0 24 24"><path d="M12 2 2 7l10 5 10-5z"/><path d="M2 12l10 5 10-5"/><path d="M2 17l10 5 10-5"/></svg></button>
        <button id="mVias" title="Descargar vías para rutas"><svg viewBox="0 0 24 24"><path d="M4 20 L10 4"/><path d="M20 20 L14 4"/><path d="M12 8v2M12 13v2M12 18v2"/></svg></button>
        <button id="mDesc" title="Descargar mapa de la zona"><svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M7 11l5 5 5-5"/><path d="M4 20h16"/></svg></button>
      </div>
    </section>

    <!-- ============ PUNTOS ============ -->
    <section class="view" id="puntos">
      <div class="search"><input id="q" type="search" placeholder="Buscar punto o finca…" autocomplete="off"></div>
      <div class="chips" id="chips"></div>
      <div id="lista"></div>
      <div style="padding:22px 14px 0">
        <button class="btn ghost wide" id="btnDatos">Datos, respaldo y fincas</button>
      </div>
    </section>
  </main>

  <nav>
    <button class="on" data-v="ir"><svg viewBox="0 0 24 24"><path d="M12 2 4.5 21l7.5-4 7.5 4z"/></svg>Ir</button>
    <button data-v="mapa"><svg viewBox="0 0 24 24"><path d="M9 4 3 6.5v14L9 18l6 2.5 6-2.5v-14L15 6.5 9 4zM9 4v14M15 6.5v14"/></svg>Mapa</button>
    <button data-v="puntos"><svg viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>Puntos</button>
  </nav>
</div>

<button class="fab" id="fab" title="Nuevo punto"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>

<div class="sheet" id="sheet"><div class="scrim" data-close></div><div class="card" id="sheetCard"></div></div>
<div class="toast" id="toast"></div>

<script>/* =====================================================================
   RUMBO — navegación offline a puntos de finca
   Sin internet, sin cuentas, sin servidores. Todo vive en el teléfono.
   ===================================================================== */
(function(){
'use strict';

/* ---------------------------------------------------------------
   1. TIPOS DE PUNTO
   --------------------------------------------------------------- */
const TIPOS = {
  pozo:         {t:'Pozo',            c:'#0A6A70', s:'PZ'},
  vertimiento:  {t:'Vertimiento',     c:'#C41E5A', s:'VT'},
  bocatoma:     {t:'Bocatoma',        c:'#1565C0', s:'BC'},
  residuos:     {t:'Acopio residuos', c:'#8A6D1F', s:'RS'},
  reforestacion:{t:'Reforestación',   c:'#3E7D32', s:'RF'},
  fauna:        {t:'Fauna / bosque',  c:'#6A4C93', s:'FA'},
  otro:         {t:'Otro',            c:'#5A6155', s:'··'}
};
const VERSION = 'v7';
const tipoDe = k => TIPOS[k] || TIPOS.otro;

/* Fondos del mapa. Se ven con señal y quedan guardados para usarlos sin ella.
   Ninguno es de Google. */
const BASES = [
  {id:'osm', nombre:'Calles', max:18,
   url:'https://tile.openstreetmap.org/{z}/{x}/{y}.png'},
  {id:'sat', nombre:'Satélite', max:18,
   url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'},
  {id:'nada', nombre:'Sin fondo', max:18, url:null}
];
let baseIdx = 0, capaBase = null;

/* ---------------------------------------------------------------
   2. ALMACENAMIENTO  (IndexedDB, con respaldo en memoria)
   --------------------------------------------------------------- */
const Store = (()=> {
  let db=null, mem={}, useMem=false;
  function open(){
    return new Promise(res=>{
      let r;
      try{ r = indexedDB.open('rumbo',1); }catch(e){ useMem=true; return res(); }
      r.onupgradeneeded = e => e.target.result.createObjectStore('kv');
      r.onsuccess = e => { db=e.target.result; res(); };
      r.onerror = () => { useMem=true; res(); };
      setTimeout(()=>{ if(!db){ useMem=true; res(); } },1500);
    });
  }
  function get(k){
    if(useMem||!db) return Promise.resolve(mem[k]);
    return new Promise(res=>{
      const rq = db.transaction('kv').objectStore('kv').get(k);
      rq.onsuccess=()=>res(rq.result); rq.onerror=()=>res(undefined);
    });
  }
  function set(k,v){
    mem[k]=v;
    if(useMem||!db) return Promise.resolve();
    return new Promise(res=>{
      const rq = db.transaction('kv','readwrite').objectStore('kv').put(v,k);
      rq.onsuccess=()=>res(); rq.onerror=()=>res();
    });
  }
  function del(k){
    delete mem[k];
    if(useMem||!db) return Promise.resolve();
    return new Promise(res=>{
      const rq = db.transaction('kv','readwrite').objectStore('kv').delete(k);
      rq.onsuccess=()=>res(); rq.onerror=()=>res();
    });
  }
  function claves(){
    if(useMem||!db) return Promise.resolve(Object.keys(mem));
    return new Promise(res=>{
      const rq = db.transaction('kv').objectStore('kv').getAllKeys();
      rq.onsuccess=()=>res(rq.result||[]); rq.onerror=()=>res([]);
    });
  }
  return {open,get,set,del,claves,volatil:()=>useMem};
})();

const R=6371008.8, rad=d=>d*Math.PI/180, deg=r=>r*180/Math.PI;

function distancia(a,b,c,d){                     // haversine, metros
  const dφ=rad(c-a), dλ=rad(d-b);
  const s=Math.sin(dφ/2)**2 + Math.cos(rad(a))*Math.cos(rad(c))*Math.sin(dλ/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}
function rumbo(a,b,c,d){                          // grados 0-360
  const φ1=rad(a),φ2=rad(c),Δλ=rad(d-b);
  const y=Math.sin(Δλ)*Math.cos(φ2);
  const x=Math.cos(φ1)*Math.sin(φ2)-Math.sin(φ1)*Math.cos(φ2)*Math.cos(Δλ);
  return (deg(Math.atan2(y,x))+360)%360;
}
const CARD=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSO','SO','OSO','O','ONO','NO','NNO'];
const cardinal = g => CARD[Math.round(g/22.5)%16];

function fmtDist(m){
  if(m==null) return ['—','m'];
  if(m<1000) return [String(Math.round(m)),'m'];
  return [(m/1000).toFixed(m<10000?2:1),'km'];
}
function fmtCoord(lat,lon){
  return lat.toFixed(6)+', '+lon.toFixed(6);
}
function fmtCoord2(lat,lon){                      // dos líneas, para el panel
  return lat.toFixed(5)+'\n'+lon.toFixed(5);
}
function enPoligono(lat,lon,ring){                // ray casting
  let dentro=false;
  for(let i=0,j=ring.length-1;i<ring.length;j=i++){
    const xi=ring[i][0],yi=ring[i][1],xj=ring[j][0],yj=ring[j][1];
    if(((yi>lat)!==(yj>lat)) && (lon < (xj-xi)*(lat-yi)/(yj-yi)+xi)) dentro=!dentro;
  }
  return dentro;
}
function fincaEn(lat,lon){
  if(!S.fincas) return null;
  for(const f of S.fincas.features){
    const g=f.geometry; if(!g) continue;
    const polys = g.type==='Polygon' ? [g.coordinates] : g.type==='MultiPolygon' ? g.coordinates : [];
    for(const p of polys) if(enPoligono(lat,lon,p[0])) return nombreFinca(f);
  }
  return null;
}
const CLAVES_NOMBRE=['nombre','NOMBRE','Nombre','finca','FINCA','Finca','name','NAME','Name',
                     'nom','NOM','predio','PREDIO','lote','LOTE','descripcion','DESCRIPCION'];
function nombreFinca(f){
  const p=f.properties||{};
  for(const k of CLAVES_NOMBRE) if(p[k]) return String(p[k]);
  for(const k in p) if(typeof p[k]==='string' && p[k].length>1 && p[k].length<60) return p[k];
  return 'Sin nombre';
}
function centroide(f){
  let sx=0,sy=0,n=0;
  (function walk(c){
    if(typeof c[0]==='number'){ sx+=c[0]; sy+=c[1]; n++; }
    else c.forEach(walk);
  })(f.geometry.coordinates);
  return n? [sy/n,sx/n] : null;
}

/* Acepta 7.85231 | -76.641 | 7°45'32.1"N | 7 45 32.1 N */
function parseCoord(txt, esLat){
  if(txt==null) return NaN;
  let s=String(txt).trim().replace(',','.').toUpperCase();
  if(!s) return NaN;
  const dec = parseFloat(s);
  if(/^[-+]?\d+(\.\d+)?$/.test(s)) return dec;
  const m = s.match(/(\d+(?:\.\d+)?)[^\d]+(\d+(?:\.\d+)?)?[^\d]*(\d+(?:\.\d+)?)?/);
  if(!m) return NaN;
  let v = parseFloat(m[1]) + (parseFloat(m[2])||0)/60 + (parseFloat(m[3])||0)/3600;
  if(/[SW]|O(?!\w)/.test(s) || s.startsWith('-')) v = -v;
  return v;
}
/* Urabá está en 6–9 N y 75–78 O: corrige signos invertidos sin preguntar dos veces */
function revisarCoord(lat,lon){
  const avisos=[];
  if(lon>0 && lon<80){ lon=-lon; avisos.push('la longitud se ajustó a negativa (occidente)'); }
  if(lat<0 && lat>-12){ lat=-lat; avisos.push('la latitud se ajustó a positiva (norte)'); }
  return {lat,lon,avisos};
}

(function dibujarAnillo(){
  const g=$('#ring'); let h='';
  for(let a=0;a<360;a+=5){
    const may = a%45===0, r1=94, r2=may?79:86;
    const x1=100+r1*Math.sin(rad(a)), y1=100-r1*Math.cos(rad(a));
    const x2=100+r2*Math.sin(rad(a)), y2=100-r2*Math.cos(rad(a));
    h+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"
         stroke="${may?'#5A6155':'#C6CBBD'}" stroke-width="${may?1.4:.9}"/>`;
  }
  [['N',0],['E',90],['S',180],['O',270]].forEach(([t,a])=>{
    const r=67, x=100+r*Math.sin(rad(a)), y=100-r*Math.cos(rad(a));
    h+=`<text x="${x.toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="middle"
        font-family="ui-monospace,monospace" font-size="11" font-weight="700"
        fill="${t==='N'?'#0F140E':'#8B9184'}">${t}</text>`;
  });
  g.innerHTML=h;
})();

/* ---------------------------------------------------------------
   GIRO CONTINUO

   La brújula entrega 0..359 y vuelve a 0 al pasar el norte. Una
   rotación CSS no sabe que 359 y 1 son vecinos: toma el camino largo
   y la aguja pega el salto. Aquí se lleva un ángulo acumulado por
   elemento y se le suma siempre el giro más corto, así 359→1 son dos
   grados a la derecha y no 358 a la izquierda.
   --------------------------------------------------------------- */
const anguloCont = new WeakMap();
function girar(el, grados){
  if(el==null || grados==null) return;
  let a = anguloCont.get(el);
  if(a==null) a = grados;
  else a += ((grados - a + 540) % 360) - 180;   // giro más corto, con signo
  anguloCont.set(el, a);
  el.style.transform = 'rotate(' + a.toFixed(1) + 'deg)';
}
function girarReset(el, grados){
  anguloCont.set(el, grados);
  el.style.transform = 'rotate(' + grados + 'deg)';
}

async function cargarGrafo(){

    const g = await Store.get('vias');
    if(g && g.lat && g.lat.length){ G = g; return true; }
  }catch(e){}
  return false;
}

/* --- descarga y armado ------------------------------------------ */
async function descargarVias(){
  if(!navigator.onLine) return aviso('Necesitas señal o wifi para bajar las vías');
  const bb = bboxFincas();
  if(!bb) return aviso('No hay fincas ni puntos que cubrir');
  if(!confirm('Bajar la red de vías de la zona de las fincas.\n\n'+
              'Se hace una sola vez, con wifi. Después las rutas se\n'+
              'calculan en el teléfono, sin internet.')) return;

  const clases='motorway|trunk|primary|secondary|tertiary|unclassified|'+
               'residential|service|track|road|living_street';
  const q='[out:json][timeout:120];way["highway"~"^('+clases+')$"]('+
          bb[1].toFixed(5)+','+bb[0].toFixed(5)+','+
          bb[3].toFixed(5)+','+bb[2].toFixed(5)+');out geom;';

  aviso('Bajando vías…');
  let datos;
  try{
    const r = await fetch('https://overpass-api.de/api/interpreter',
      {method:'POST', body:'data='+encodeURIComponent(q),
       headers:{'Content-Type':'application/x-www-form-urlencoded'}});
    if(!r.ok) throw new Error('respuesta '+r.status);
    datos = await r.json();
  }catch(e){ return aviso('No se pudo bajar: '+e.message); }

  const g = armarGrafo(datos.elements||[]);
  if(!g.lat.length) return aviso('No se encontraron vías en la zona');
  G = g;
  try{ await Store.set('vias', g); }catch(e){}
  aviso(g.lat.length+' cruces y '+g.tramos+' tramos guardados. Las rutas ya sirven sin señal.');
  if(S.destinoId) recalcular(true);
}

function armarGrafo(els){
  const idx = new Map(), lat = [], lon = [], adj = [];
  let tramos = 0;
  const clave = (a,b) => a.toFixed(6)+','+b.toFixed(6);
  const nodo = (a,b) => {
    const k = clave(a,b);
    let i = idx.get(k);
    if(i==null){ i = lat.length; idx.set(k,i); lat.push(a); lon.push(b); adj.push([]); }
    return i;
  };
  for(const e of els){
    if(e.type!=='way' || !e.geometry || e.geometry.length<2) continue;
    const f = CLASES[(e.tags&&e.tags.highway)||'road'] || 1.2;
    let prev = nodo(e.geometry[0].lat, e.geometry[0].lon);
    for(let i=1;i<e.geometry.length;i++){
      const cur = nodo(e.geometry[i].lat, e.geometry[i].lon);
      if(cur===prev) continue;
      const m = distancia(lat[prev],lon[prev],lat[cur],lon[cur]);
      adj[prev].push([cur,m,f]); adj[cur].push([prev,m,f]);
      tramos++; prev = cur;
    }
  }
  return {v:1, lat, lon, adj, tramos, creado:Date.now()};
}

/* --- búsqueda del camino ---------------------------------------- */
function nodoCercano(la,lo){
  if(!G) return -1;
  let mejor=-1, md=Infinity;
  for(let i=0;i<G.lat.length;i++){
    const dy=(G.lat[i]-la), dx=(G.lon[i]-lo)*0.99;
    const d=dy*dy+dx*dx;
    if(d<md){ md=d; mejor=i; }
  }
  return mejor;
}

/* Montículo binario: sin él, A* sobre miles de cruces se arrastra. */
function Monticulo(){
  const a=[];
  return {
    tam:()=>a.length,
    meter(v,p){ a.push([p,v]); let i=a.length-1;
      while(i>0){ const j=(i-1)>>1; if(a[j][0]<=a[i][0]) break;
        [a[i],a[j]]=[a[j],a[i]]; i=j; } },
    sacar(){ const t=a[0]; const u=a.pop();
      if(a.length){ a[0]=u; let i=0;
        for(;;){ const l=2*i+1,r=l+1; let m=i;
          if(l<a.length&&a[l][0]<a[m][0]) m=l;
          if(r<a.length&&a[r][0]<a[m][0]) m=r;
          if(m===i) break; [a[i],a[m]]=[a[m],a[i]]; i=m; } }
      return t[1]; }
  };
}

function aEstrella(ini, fin){
  if(!G) return null;
  const n=G.lat.length;
  /* índices fuera de rango dejaban el rearmado del camino en bucle */
  if(!n || ini<0 || fin<0 || ini>=n || fin>=n) return null;
  if(ini===fin) return null;
  const g=new Float64Array(n).fill(Infinity);
  const de=new Int32Array(n).fill(-1);
  const cerrado=new Uint8Array(n);
  const h=i=>distancia(G.lat[i],G.lon[i],G.lat[fin],G.lon[fin]);
  const cola=Monticulo();
  g[ini]=0; cola.meter(ini,h(ini));
  let visitados=0;
  while(cola.tam()){
    const u=cola.sacar();
    if(cerrado[u]) continue;
    cerrado[u]=1; visitados++;
    if(u===fin) break;
    if(visitados>200000) break;          // freno de seguridad
    for(const [v,m,f] of G.adj[u]){
      const alt=g[u]+m*f;
      if(alt<g[v]){ g[v]=alt; de[v]=u; cola.meter(v,alt+h(v)); }
    }
  }
  if(!isFinite(g[fin])) return null;
  const camino=[]; let c=fin, tope=n+1;
  while(c!==-1 && tope-- > 0){ camino.push(c); c=de[c]; }
  if(tope<=0) return null;                 // cadena rota: mejor sin ruta que colgado
  camino.reverse();
  return camino.length>1 ? camino : null;
}

/* --- indicaciones ------------------------------------------------ */
function armarPasos(camino, destino){
  const pts = camino.map(i=>[G.lat[i],G.lon[i]]);
  const pasos = [];
  let acumulado = 0;
  for(let i=1;i<pts.length;i++){
    acumulado += distancia(pts[i-1][0],pts[i-1][1],pts[i][0],pts[i][1]);
    if(i===pts.length-1) break;
    const b1 = rumbo(pts[i-1][0],pts[i-1][1],pts[i][0],pts[i][1]);
    const b2 = rumbo(pts[i][0],pts[i][1],pts[i+1][0],pts[i+1][1]);
    let d = ((b2-b1+540)%360)-180;
    if(Math.abs(d) < 32) continue;                  // curva suave, no es giro
    pasos.push({en:acumulado, lat:pts[i][0], lon:pts[i][1],
      giro: d>0?'der':'izq', fuerte: Math.abs(d)>105,
      texto: (Math.abs(d)>105 ? 'Giro cerrado a la ' : 'Gire a la ')+
             (d>0?'derecha':'izquierda')});
    acumulado = 0;
  }
  const fin = pts[pts.length-1];
  const ultimo = distancia(fin[0],fin[1],destino.lat,destino.lon);
  pasos.push({en:acumulado+ultimo, lat:destino.lat, lon:destino.lon,
    giro:'fin', texto:'Llegó al punto'});
  return {pts, pasos, ultimo};
}

function recalcular(forzar){
  const d = S.puntos.find(p=>p.id===S.destinoId);
  if(!G || !d || !S.pos){ rutaActual=null; pintarRuta(); return; }
  const ahora = Date.now();
  if(!forzar){
    if(ahora-ultimoCalculo < 8000) return;
    if(origenCalculo && distancia(origenCalculo[0],origenCalculo[1],
        S.pos.lat,S.pos.lon) < 25 && rutaActual && rutaActual.destino===d.id) return;
  }
  ultimoCalculo = ahora; origenCalculo=[S.pos.lat,S.pos.lon];

  const a = nodoCercano(S.pos.lat,S.pos.lon);
  const b = nodoCercano(d.lat,d.lon);
  const camino = aEstrella(a,b);
  if(!camino || camino.length<2){ rutaActual=null; pintarRuta(); return; }

  const {pts, pasos, ultimo} = armarPasos(camino, d);
  let metros = ultimo;
  for(let i=1;i<pts.length;i++)
    metros += distancia(pts[i-1][0],pts[i-1][1],pts[i][0],pts[i][1]);

  rutaActual = {puntos:pts, pasos, metros, ultimo, destino:d.id};
  pintarRuta();
}

function pintarRuta(){
  if(!mapa) return;
  if(capaCamino){ mapa.removeLayer(capaCamino); capaCamino=null; }
  if(!rutaActual) return;
  const d = S.puntos.find(p=>p.id===rutaActual.destino);
  capaCamino = L.layerGroup([
    L.polyline(rutaActual.puntos,{color:'#0A6A70',weight:6,opacity:.85}),
    L.polyline([rutaActual.puntos[rutaActual.puntos.length-1],[d.lat,d.lon]],
      {color:'#C41E5A',weight:4,opacity:.9,dashArray:'8 6'})
  ]).addTo(mapa);
}

/* Paso vigente: el primero cuyo punto de giro todavía tengo por delante. */
function pasoVigente(){
  if(!rutaActual || !S.pos) return null;
  let mejor=null, md=Infinity;
  rutaActual.pasos.forEach((p,i)=>{
    const m=distancia(S.pos.lat,S.pos.lon,p.lat,p.lon);
    if(m<md){ md=m; mejor={paso:p, idx:i, falta:m}; }
  });
  if(!mejor) return null;
  /* si ya casi lo piso, el que importa es el siguiente */
  if(mejor.falta<22 && rutaActual.pasos[mejor.idx+1]){
    const sig=rutaActual.pasos[mejor.idx+1];
    return {paso:sig, falta:distancia(S.pos.lat,S.pos.lon,sig.lat,sig.lon)};
  }
  return {paso:mejor.paso, falta:mejor.falta};
}

/* ---------------------------------------------------------------
   ACTUALIZACIONES

   El service worker sirve la copia guardada primero, que es lo que
   permite usar la app sin señal. El costo es que una versión nueva
   no entra sola: hay que detectarla y decírselo al usuario.
   --------------------------------------------------------------- */
let regSW = null, recargando = false;

function mostrarAvisoActualizar(trabajador){
  if(document.getElementById('avisoAct')) return;
  const d=document.createElement('div');
  d.className='aviso-act'; d.id='avisoAct';
  d.innerHTML='<b>Hay una versión nueva</b><button>Actualizar</button>';
  d.querySelector('button').onclick=()=>{
    d.remove();
    if(trabajador) trabajador.postMessage({tipo:'saltar'});
  };
  document.body.appendChild(d);
}

/* Reinicio a fondo: borra la app guardada pero conserva las teselas y
   las vías, que costaron datos. Es la salida cuando algo se atasca. */
async function reinstalar(){
  if(!confirm('Volver a bajar la app desde el servidor.\n\n'+
              'Conserva puntos, fincas, visitas, fotos, mapas y vías.\n\n'+
              'OJO: esto NO es lo mismo que "Borrar datos" de Chrome.\n'+
              'Eso sí borra todo, incluidas las descargas del campo.')) return;
  try{
    if('serviceWorker' in navigator){
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if(window.caches){
      const ks = await caches.keys();
      await Promise.all(ks.filter(k=>k!=='rumbo-teselas').map(k=>caches.delete(k)));
    }
  }catch(e){}
  location.replace(location.pathname+'?r='+Date.now());
}

async function textoDiagnostico(){
  const L=[];
  L.push('versión de esta pantalla : '+VERSION);
  L.push('origen                   : '+location.origin);
  L.push('ruta                     : '+location.pathname);
  L.push('protocolo                : '+location.protocol+
         (location.protocol==='file:' ? '   ← sin GPS ni guardado' : ''));

  let sw='no soportado';
  if('serviceWorker' in navigator){
    const ctrl = navigator.serviceWorker.controller;
    sw = ctrl ? 'activo' : 'ninguno controlando';
    try{
      const regs = await navigator.serviceWorker.getRegistrations();
      sw += '  ('+regs.length+' registrado'+(regs.length===1?'':'s')+')';
    }catch(e){}
  }
  L.push('service worker           : '+sw);

  let cachesTxt='no soportado', teselas=0;
  if(window.caches){
    try{
      const ks=await caches.keys();
      cachesTxt = ks.length? ks.join(', ') : 'ninguna';
      if(ks.includes('rumbo-teselas'))
        teselas=(await (await caches.open('rumbo-teselas')).keys()).length;
    }catch(e){}
  }
  L.push('cachés                   : '+cachesTxt);
  L.push('piezas de mapa guardadas : '+teselas);
  L.push('vías para rutas          : '+(G? G.lat.length+' cruces' : 'sin descargar'));
  L.push('guardado en disco        : '+(Store.volatil()? 'NO (solo memoria)' : 'sí'));
  L.push('puntos / fincas          : '+S.puntos.length+' / '+(S.fincas?S.fincas.features.length:0));
  L.push('visitas / fotos          : '+S.visitas.length+' / '+
         S.visitas.reduce((n,v)=>n+((v.fotos||[]).length),0));
  L.push('brújula                  : '+(S.heading==null? 'sin lectura' : Math.round(S.heading)+'°'));
  return L.join('\n');
}

/* ---------------------------------------------------------------
   VISITAS

   Llegar al punto es la mitad del trabajo. La otra mitad es dejar
   constancia de cómo se encontró. Cada visita guarda estado,
   observación, quién fue, cuándo, desde qué coordenada, y las fotos
   con el sello quemado encima — así la foto sigue sirviendo de
   evidencia aunque salga de la app.
   --------------------------------------------------------------- */
const ESTADOS = {
  bien:     {t:'Sin novedad',   c:'#2E7D4F', s:'✓'},
  novedad:  {t:'Con novedad',   c:'#C08A1E', s:'!'},
  nohay:    {t:'No se encontró',c:'#C41E5A', s:'✕'},
  sinacceso:{t:'Sin acceso',    c:'#5C6470', s:'—'}
};
const estadoDe = k => ESTADOS[k] || ESTADOS.bien;

const visitasDe = id => S.visitas.filter(v=>v.puntoId===id)
                                 .sort((a,b)=>b.cuando-a.cuando);
const ultimaVisita = id => visitasDe(id)[0] || null;

function fechaCorta(ms){
  const d=new Date(ms), p=n=>String(n).padStart(2,'0');
  return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+d.getFullYear()+' '+p(d.getHours())+':'+p(d.getMinutes());
}

/* Reduce la foto y le quema el sello de campo. Una foto de celular
   pesa varios MB: sin esto, veinte visitas llenan el teléfono. */
function procesarFoto(archivo, l1, l2){
  return new Promise((res,rej)=>{
    const img=new Image(), url=URL.createObjectURL(archivo);
    img.onload=()=>{
      try{
        const MAX=1280;
        let w=img.naturalWidth, h=img.naturalHeight;
        if(!w||!h) throw new Error('imagen vacía');
        const k=Math.min(1, MAX/Math.max(w,h));
        w=Math.round(w*k); h=Math.round(h*k);
        const cv=document.createElement('canvas');
        cv.width=w; cv.height=h;
        const cx=cv.getContext('2d');
        cx.drawImage(img,0,0,w,h);
        const bh=Math.max(44, Math.round(h*0.105));
        cx.fillStyle='rgba(9,17,10,.74)';
        cx.fillRect(0,h-bh,w,bh);
        const f1=Math.max(12,Math.round(bh*0.31)), f2=Math.max(10,Math.round(bh*0.25));
        const corta=(txt,fuente)=>{ cx.font=fuente; let t=txt;
          while(cx.measureText(t).width>w-20 && t.length>4) t=t.slice(0,-2);
          return t; };
        cx.fillStyle='#fff';
        cx.fillText(corta(l1,'600 '+f1+'px system-ui,-apple-system,sans-serif'), 10, h-bh+f1+5);
        cx.fillStyle='rgba(255,255,255,.88)';
        cx.fillText(corta(l2,f2+'px ui-monospace,Menlo,monospace'), 10, h-bh+f1+f2+10);
        URL.revokeObjectURL(url);
        res(cv.toDataURL('image/jpeg',0.72));
      }catch(e){ URL.revokeObjectURL(url); rej(e); }
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('No se pudo leer la foto')); };
    img.src=url;
  });
}

const fotoKey = id => 'foto:'+id;
async function guardarFoto(dataUrl){
  const id='f'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  await Store.set(fotoKey(id), dataUrl);
  return id;
}
async function leerFoto(id){ try{ return await Store.get(fotoKey(id)); }catch(e){ return null; } }

function verFoto(dataUrl){
  const d=document.createElement('div');
  d.className='visor';
  d.innerHTML='<img alt="Foto de la visita">';
  d.querySelector('img').src=dataUrl;
  d.onclick=()=>d.remove();
  document.body.appendChild(d);
}

    <div class="f" style="margin-top:12px"><span class="lbl">Observación</span>

    <button class="btn ghost wide" style="margin:8px 0 4px" id="vCam">Tomar foto</button>

    <div class="strip" style="margin:14px 0 4px">
      <div><span class="lbl">Desde</span><b id="vPos" style="font-size:12px">—</b></div>
      <div><span class="lbl">Quién</span><b id="vQuien" style="font-size:12px">—</b></div>
    </div>

    <button class="btn wide" style="margin-top:12px" id="vOk">Guardar visita</button>
    <input type="file" id="vFile" accept="image/*" capture="environment" style="display:none">`);

  const c=$('#sheetCard');
  c.querySelector('#vPos').textContent = S.pos
    ? fmtCoord2(S.pos.lat,S.pos.lon)+' ±'+Math.round(S.pos.acc||0)+'m' : 'sin GPS';
  c.querySelector('#vQuien').textContent = S.quien || 'sin nombre';

  c.querySelector('#estsel').onclick=e=>{
    const b=e.target.closest('[data-e]'); if(!b) return;
    estado=b.dataset.e;
    c.querySelectorAll('#estsel button').forEach(x=>{
      const on = x.dataset.e===estado;
      x.classList.toggle('on',on);
      x.style.background = on ? ESTADOS[x.dataset.e].c : '';
    });
  };

  const fi=c.querySelector('#vFile');
  c.querySelector('#vCam').onclick=()=>fi.click();
  fi.onchange=async()=>{
    const f=fi.files&&fi.files[0]; fi.value='';
    if(!f) return;
    aviso('Procesando foto…');
    const l1 = p.nombre + (p.finca? ' · '+p.finca : '');
    const l2 = fechaCorta(Date.now()) + '  ' +
      (S.pos? fmtCoord2(S.pos.lat,S.pos.lon)+' ±'+Math.round(S.pos.acc||0)+'m' : 'sin GPS');
    try{
      const dataUrl=await procesarFoto(f,l1,l2);
      pendientes.push(dataUrl);
      pintarPendientes();
      aviso(pendientes.length+' foto'+(pendientes.length===1?'':'s'));
    }catch(e){ aviso('No se pudo procesar: '+e.message); }
  };

  function pintarPendientes(){
    const cont=c.querySelector('#vFotos');
    cont.innerHTML = pendientes.map((d,i)=>
      `<div style="position:relative"><img src="${d}" data-i="${i}" alt="Foto ${i+1}"><span class="marca">${i+1}</span></div>`
    ).join('') || '<p class="mini" style="margin:0">Ninguna todavía</p>';
    cont.querySelectorAll('img').forEach(im=>im.onclick=()=>verFoto(im.src));
  }
  pintarPendientes();

  c.querySelector('#vOk').onclick=async()=>{
    const obs=c.querySelector('#vObs').value.trim();
    if(estado!=='bien' && !obs && !pendientes.length)
      return aviso('Agrega una observación o una foto para respaldar la novedad');
    const fotos=[];
    for(const d of pendientes){ try{ fotos.push(await guardarFoto(d)); }catch(e){} }
    S.visitas.push({
      id:'v'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
      puntoId, cuando:Date.now(), quien:S.quien||'', estado, obs,
      lat:S.pos?S.pos.lat:null, lon:S.pos?S.pos.lon:null,
      acc:S.pos?Math.round(S.pos.acc||0):null, fotos
    });
    await guardarVisitas();
    cerrarHoja(); refrescar();
    aviso('Visita registrada');
  };
}

      im.onclick=()=>verFoto(d);
      cf.appendChild(im);
    }
  }
}

/* ---------------------------------------------------------------
   PROMEDIADO DE POSICIÓN

   Una lectura suelta de GPS bajo dosel de banano baila varios metros.
   Quedándose quieto y promediando muchas lecturas, el error se
   reparte y el punto queda mucho mejor fijado.

   Se pesa cada lectura por su propia precisión (1/acc²): una lectura
   de ±4 m manda mucho más que una de ±30 m. Y se descartan los saltos,
   que son los que más dañan un promedio simple.
   --------------------------------------------------------------- */
function promediar(muestras){
  if(!muestras.length) return null;
  const mejor = Math.min(...muestras.map(m=>m.acc||99));
  /* fuera los saltos: lecturas mucho peores que la mejor del lote */
  const buenas = muestras.filter(m=>(m.acc||99) <= Math.max(mejor*3, mejor+12));
  const uso = buenas.length>=3 ? buenas : muestras;

  let sw=0, slat=0, slon=0;
  for(const m of uso){
    const w = 1/Math.pow(Math.max(m.acc||15,1),2);
    sw+=w; slat+=m.lat*w; slon+=m.lon*w;
  }
  const lat=slat/sw, lon=slon/sw;

  /* dispersión real de las lecturas: más honesta que el ± del equipo */
  let s2=0;
  for(const m of uso) s2 += Math.pow(distancia(lat,lon,m.lat,m.lon),2);
  const disp = Math.sqrt(s2/uso.length);

  /* La dispersión dice cuánto baila el GPS. Lo que interesa es qué tan bien
     quedó el PROMEDIO, y eso mejora con la raíz del número de lecturas.
     Mostrar solo la dispersión haría ver malo un punto que quedó fino. */
  const err = disp/Math.sqrt(Math.max(uso.length,1));

  return {lat, lon, disp, err, n:uso.length,
          descartadas:muestras.length-uso.length, mejor};
}

function hojaPromedio(alTerminar){
  const TOPE=60, MIN=8;
  const muestras=[];
  let vigilante=null, terminado=false;

  abrirHoja(`
    <h3>Promediar posición</h3>
    <p class="mini" style="margin:-6px 0 14px">Quédate quieto, con el celular hacia el cielo abierto. <b>Error est.</b> es qué tan bueno va quedando el punto; <b>baile GPS</b> es cuánto se mueve la señal.</p>
    <div class="prom">
      <div class="big" id="pN">0</div>
      <div class="lbl2">lecturas tomadas</div>
    </div>
    <div class="barra"><i id="pBar"></i></div>
    <div class="calidad">
      <div><b id="pErr">—</b><span>ERROR EST.</span></div>
      <div><b id="pDisp">—</b><span>BAILE GPS</span></div>
      <div><b id="pDesc">0</b><span>DESCARTADAS</span></div>
    </div>
    <div class="f" style="margin-top:14px"><span class="lbl">Coordenada promediada</span>
      <div id="pCoord" style="font-family:var(--mono);font-size:14px">esperando…</div></div>
    <button class="btn wide" id="pOk" disabled style="margin-top:6px">Usar esta posición</button>
    <button class="btn grey wide" style="margin-top:9px" id="pNo">Cancelar</button>`);

  const c=$('#sheetCard');
  const bOk=c.querySelector('#pOk');

  function pintar(){
    const r=promediar(muestras);
    c.querySelector('#pN').textContent=muestras.length;
    c.querySelector('#pBar').style.width=Math.min(100,muestras.length/TOPE*100)+'%';
    if(muestras.length>=MIN){ bOk.disabled=false; bOk.textContent='Usar esta posición'; }
    else { bOk.disabled=true; bOk.textContent='Faltan '+(MIN-muestras.length)+' lecturas'; }
    if(!r) return;
    c.querySelector('#pErr').textContent='±'+r.err.toFixed(1)+' m';
    c.querySelector('#pDisp').textContent=r.disp.toFixed(1)+' m';
    c.querySelector('#pDesc').textContent=r.descartadas;
    c.querySelector('#pCoord').textContent=fmtCoord2(r.lat,r.lon);
  }
  pintar();

  function parar(){
    terminado=true;
    if(vigilante!=null){ try{ navigator.geolocation.clearWatch(vigilante); }catch(e){} vigilante=null; }
  }

  if(!navigator.geolocation){ aviso('Este navegador no da ubicación'); return; }
  vigilante = navigator.geolocation.watchPosition(p=>{
    if(terminado) return;
    const c2=p.coords;
    muestras.push({lat:c2.latitude, lon:c2.longitude, acc:c2.accuracy||99});
    pintar();
    if(muestras.length>=TOPE){ parar(); aviso('Listo: '+TOPE+' lecturas'); }
  }, err=>{
    aviso(err.code===1? 'Ubicación bloqueada' : 'Sin señal GPS suficiente');
  }, {enableHighAccuracy:true, maximumAge:0, timeout:25000});

  bOk.onclick=()=>{
    const r=promediar(muestras);
    parar();
    if(!r) return aviso('Todavía no hay lecturas');
    cerrarHoja();
    alTerminar(r);
  };
  c.querySelector('#pNo').onclick=()=>{ parar(); cerrarHoja(); };
  /* si cierra la hoja de otra forma, no dejar el GPS corriendo */
  $('#sheet').querySelector('.scrim').addEventListener('click', parar, {once:true});
}

let ultimoAviso=0, avisadoLlegada=null;
function pintarIr(){
  const d = S.puntos.find(p=>p.id===S.destinoId);
  const ring=$('#ring'), needle=$('#needle');
  const hdg = S.heading;

  if(hdg==null) girarReset(ring,0); else girar(ring,-hdg);

  if(!d){
    $('#tgtName').textContent='Sin destino';
    $('#tgtSub').textContent = S.puntos.length? 'Toca para elegir un punto' : 'Primero agrega o importa puntos';
    $('#dist').innerHTML='—<small>m</small>'; $('#brg').textContent='rumbo —';
    $('#tgtPos').textContent='—'; needle.style.opacity=.18; girarReset(needle,0);
    return;
  }
  needle.style.opacity=1;
  $('#tgtName').textContent=d.nombre;
  $('#tgtSub').textContent=(d.finca? d.finca+' · ':'')+tipoDe(d.tipo).t;
  $('#tgtPos').textContent=fmtCoord2(d.lat,d.lon);

  if(!S.pos){ $('#dist').innerHTML='—<small>m</small>'; $('#brg').textContent='esperando GPS'; return; }

  const m=distancia(S.pos.lat,S.pos.lon,d.lat,d.lon);
  const b=rumbo(S.pos.lat,S.pos.lon,d.lat,d.lon);
  const [n,u]=fmtDist(m);
  $('#dist').innerHTML=esc(n)+'<small>'+u+'</small>';
  $('#brg').textContent = hdg==null
    ? `rumbo ${Math.round(b)}° ${cardinal(b)} · norte arriba`
    : `rumbo ${Math.round(b)}° ${cardinal(b)}`;
  girar(needle, hdg==null ? b : b-hdg);

  /* Indicación de ruta, si ya se bajaron las vías */
  const panel=$('#panelRuta');
  recalcular(false);
  if(rutaActual){
    const pv = pasoVigente();
    panel.style.display='';
    $('#rutaGiro').textContent = pv ? (FLECHAS[pv.paso.giro]||'↑') : '↑';
    $('#rutaPaso').textContent = pv ? pv.paso.texto : 'Siga derecho';
    const [fn,fu] = fmtDist(pv? pv.falta : 0);
    $('#rutaEn').textContent = pv && pv.paso.giro!=='fin'
      ? 'en '+fn+' '+fu : 'a '+fn+' '+fu;
    const [tn,tu] = fmtDist(rutaActual.metros);
    $('#rutaTotal').textContent = 'ruta '+tn+' '+tu;
    const [un,uu] = fmtDist(rutaActual.ultimo);
    $('#rutaVia').textContent = rutaActual.ultimo>25
      ? 'últimos '+un+' '+uu+' a pie, sin vía'
      : 'la vía llega al punto';
  } else if(!G){
    /* Antes esto se escondía sin decir nada y parecía que la función se
       había perdido. Ahora dice qué falta y se arregla con un toque. */
    panel.style.display='';
    panel.classList.add('apagado');
    $('#rutaGiro').textContent='↓';
    $('#rutaPaso').textContent='Rutas no disponibles';
    $('#rutaEn').textContent='faltan las vías de la zona';
    $('#rutaVia').textContent='toca aquí para descargarlas';
    $('#rutaTotal').textContent='una vez, con wifi';
  } else {
    panel.style.display='none';
    panel.classList.remove('apagado');
  }
  if(rutaActual) panel.classList.remove('apagado');

  // anillo de precisión, a escala con la distancia mostrada
  const escala = 74/Math.max(m,10);
  $('#accRing').setAttribute('r', Math.max(6,Math.min(74,(S.pos.acc||15)*escala)).toFixed(1));

  /* Umbral atado a la precisión real: con ±20 m no tiene sentido exigir 12 m.
     La vibración es para no ir mirando la pantalla mientras se camina. */
  const cerca = Math.max(12, Math.min(30, (S.pos.acc||12)));
  if(m<cerca && avisadoLlegada!==d.id && Date.now()-ultimoAviso>8000){
    avisadoLlegada=d.id; ultimoAviso=Date.now();
    try{ navigator.vibrate && navigator.vibrate([90,70,90,70,180]); }catch(e){}
    aviso('Llegaste: '+d.nombre+' · busca a la vista');
  }
  if(m>cerca*2.5) avisadoLlegada=null;   // si se aleja, vuelve a avisar al regresar
  $('#hint').textContent = m<25
    ? 'Estás sobre el punto. Con esta precisión, búscalo a la vista en los últimos metros.'
    : (hdg==null
       ? 'Sin brújula: el norte queda arriba. Gira hasta que la aguja apunte al frente.'
       : 'Apunta el celular hacia adelante y camina. La aguja roja marca el punto.');
}

/* ---------------------------------------------------------------
   7. GPS
   --------------------------------------------------------------- */
function iniciarGPS(){
  if(!navigator.geolocation){ $('#gpsTxt').textContent='Este navegador no da ubicación'; return; }
  /* Sin origen seguro el navegador NI SIQUIERA pregunta: no hay permiso que dar. */
  if(location.protocol==='file:'){
    $('#gpsDot').className='dot bad';
    $('#gpsTxt').textContent='Abre la app desde su enlace https, no desde el archivo';
    return;
  }
  navigator.geolocation.watchPosition(p=>{
    const c=p.coords;
    S.pos={lat:c.latitude,lon:c.longitude,acc:c.accuracy,spd:c.speed,hdg:c.heading,t:p.timestamp};
    if(S.heading==null && c.heading!=null && c.speed>0.6) S.heading=c.heading;
    const a=Math.round(c.accuracy);
    $('#gpsDot').className='dot '+(a<=10?'good':a<=25?'mid':'bad');
    $('#gpsTxt').textContent=`GPS ±${a} m${c.speed>0.4?' · '+(c.speed*3.6).toFixed(1)+' km/h':''}`;
    $('#myPos').textContent=fmtCoord2(c.latitude,c.longitude);
    const f=fincaEn(c.latitude,c.longitude);
    $('#where').textContent = f? 'en '+f : `±${a} m`;
    pintarIr(); marcarYo(); pintarLista();
  }, err=>{
    $('#gpsDot').className='dot bad';
    $('#gpsTxt').textContent = err.code===1
      ? 'Ubicación bloqueada: actívala para este sitio'
      : 'Sin señal GPS todavía. Sal a cielo abierto.';
    const f=$('#filaPermiso'); if(f) f.style.display='';
  }, {enableHighAccuracy:true, maximumAge:1500, timeout:20000});
}

/* El prompt del navegador sale de forma confiable solo tras un toque del usuario.
   Por eso hay un botón, en vez de pedirlo callado al abrir. */
function pedirUbicacion(){
  if(!navigator.geolocation) return aviso('Este navegador no da ubicación');
  if(location.protocol==='file:')
    return aviso('Ábrela desde su enlace https: así el navegador sí pide el permiso');
  $('#gpsTxt').textContent='Pidiendo permiso…';
  navigator.geolocation.getCurrentPosition(
    ()=>{ const f=$('#filaPermiso'); if(f) f.style.display='none'; iniciarGPS(); },
    err=>{ aviso(err.code===1
        ? 'Permiso negado. Actívalo en los ajustes del navegador para este sitio.'
        : 'Sin señal todavía. Sal a cielo abierto e intenta otra vez.'); },
    {enableHighAccuracy:true, timeout:20000});
}

/* ---------------------------------------------------------------
   8. BRÚJULA
   --------------------------------------------------------------- */
function escucharBrujula(){
  const on = e => {
    let h=null;
    if(e.webkitCompassHeading!=null) h=e.webkitCompassHeading;
    else if(e.alpha!=null && (e.absolute||e.type==='deviceorientationabsolute')) h=360-e.alpha;
    if(h==null) return;
    const so=(screen.orientation&&screen.orientation.angle)||window.orientation||0;
    const nuevo=(h+so+360)%360;
    if(S.heading==null) S.heading=nuevo;
    else{
      /* promedio por el lado corto: quita el temblor sin cruzar mal el norte */
      const d=((nuevo-S.heading+540)%360)-180;
      S.heading=(S.heading+d*0.3+360)%360;
    }
    pintarIr();
  };
  window.addEventListener('deviceorientationabsolute',on,true);
  window.addEventListener('deviceorientation',on,true);
}
$('#btnCalib').onclick=async()=>{
  if(typeof DeviceOrientationEvent!=='undefined' && DeviceOrientationEvent.requestPermission){
    try{
      const r=await DeviceOrientationEvent.requestPermission();
      if(r!=='granted'){ aviso('Sin permiso de brújula: se usa norte arriba'); return; }
    }catch(e){ aviso('La brújula no está disponible'); return; }
  }
  escucharBrujula();
  aviso('Mueve el teléfono en forma de 8 durante 3 segundos');
};

   9. MAPA (Leaflet, sin teselas: plano de campo)
   --------------------------------------------------------------- */
let zoomEtiq=false, encuadrado=false;
let mapa=null, capaFincas=null, capaPuntos=null, capaYo=null, capaRuta=null, etiquetas=true, capaTeselas=null;

function iniciarMapa(){
  mapa = L.map('map',{zoomControl:false,attributionControl:true,tap:false})
          .setView(centroFincas(),12);
  mapa.attributionControl.setPrefix('');
  L.control.zoom({position:'topright'}).addTo(mapa);
  L.control.scale({position:'topleft',imperial:false,maxWidth:130}).addTo(mapa);
  mapa.on('zoomend',()=>{ const z=mapa.getZoom(); if((z>=15)!==zoomEtiq){ zoomEtiq=z>=15; pintarMapa(); } });
  ponerBase(guardadoBase());
  capaFincas=L.featureGroup().addTo(mapa);
  capaRuta=L.layerGroup().addTo(mapa);
  capaPuntos=L.featureGroup().addTo(mapa);
  capaYo=L.layerGroup().addTo(mapa);
  mapa.on('click', e=>{
    if(!modoTocar) return;
    modoTocar=false; document.body.style.cursor='';
    editorPunto(null,{lat:e.latlng.lat,lon:e.latlng.lng});
  });
  if(location.protocol.startsWith('http')) probarTeselas();
  pintarMapa();
  /* encuadrar de una: si no, el mapa abre en un punto fijo y puede verse vacío */
  setTimeout(()=>{ mapa.invalidateSize(); encuadrar(); encuadrado=true; },120);
}

/* Centro de todas las fincas, para no abrir nunca en un lugar vacío */
function centroFincas(){
  try{
    let x0=180,y0=90,x1=-180,y1=-90;
    (function w(c){ if(typeof c[0]==='number'){
        x0=Math.min(x0,c[0]); x1=Math.max(x1,c[0]);
        y0=Math.min(y0,c[1]); y1=Math.max(y1,c[1]);
      } else c.forEach(w); })(FINCAS_BASE.features.map(f=>f.geometry.coordinates));
    return [(y0+y1)/2,(x0+x1)/2];
  }catch(e){ return [7.84,-76.70]; }
}

function guardadoBase(){
  try{ const v=localStorage.getItem('rumbo_base'); const i=BASES.findIndex(b=>b.id===v);
       return i<0?0:i; }catch(e){ return 0; }
}
function ponerBase(i){
  baseIdx = (i+BASES.length)%BASES.length;
  const b = BASES[baseIdx];
  if(capaBase){ mapa.removeLayer(capaBase); capaBase=null; }
  if(b.url){
    capaBase = L.tileLayer(b.url,{maxZoom:b.max,maxNativeZoom:b.max,crossOrigin:true,
      errorTileUrl:'', attribution: b.id==='osm' ? 'OpenStreetMap' : 'Esri'}).addTo(mapa);
    capaBase.bringToBack();
  }
  try{ localStorage.setItem('rumbo_base',b.id); }catch(e){}
  return b;
}
function probarTeselas(){
  if(typeof fetch!=='function') return;
  try{
  fetch('tiles/meta.json',{cache:'force-cache'}).then(r=>{ if(!r.ok) throw 0; return r.json(); }).then(m=>{
    const b=document.createElement('button');
    b.title='Fotografía aérea'; b.innerHTML='<svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 3-3 5 5"/><circle cx="8.5" cy="7.5" r="1.6"/><rect x="3" y="4" width="18" height="16" rx="1"/></svg>';
    b.onclick=()=>{
      if(capaTeselas){ mapa.removeLayer(capaTeselas); capaTeselas=null; b.classList.remove('act'); }
      else{
        capaTeselas=L.tileLayer('tiles/{z}/{x}/{y}.'+(m.ext||'jpg'),
          {minZoom:m.minZoom||10,maxZoom:m.maxZoom||18,maxNativeZoom:m.maxZoom||18,errorTileUrl:''}).addTo(mapa);
        capaTeselas.bringToBack(); b.classList.add('act');
      }
    };
    $('.mapbtns').appendChild(b);
  }).catch(()=>{});
  }catch(e){}
}

function pintarMapa(){
  if(!mapa) return;
  capaFincas.clearLayers(); capaPuntos.clearLayers();

  if(S.fincas){
    L.geoJSON(S.fincas,{
      style:f=>/LineString/.test(f.geometry.type)
        ? {color:'#8A6D1F',weight:2.4,opacity:.9,dashArray:'1 5',lineCap:'round'}   // caminos y canales
        : {color:'#C41E5A',weight:2.2,fillColor:'#C41E5A',fillOpacity:.10},
      onEachFeature:(f,l)=>{
        const esLinea=/LineString/.test(f.geometry.type), c=centroide(f);
        if(etiquetas && c && !esLinea) L.marker(c,{interactive:false,icon:L.divIcon({className:'',
          html:'<div class="finca-label">'+esc(nombreFinca(f))+'</div>',iconSize:[0,0]})}).addTo(capaFincas);
        l.on('click',()=>aviso(nombreFinca(f)));
      }
    }).addTo(capaFincas);
  }

  S.puntos.forEach(p=>{
    const t=tipoDe(p.tipo), act=p.id===S.destinoId;
    const html=`<div style="position:relative;transform:translate(-50%,-100%)">
      <div style="display:flex;flex-direction:column;align-items:center">
        <div style="background:${t.c};color:#fff;font:700 10px/1 ui-monospace,monospace;
          width:22px;height:22px;border-radius:2px;display:grid;place-items:center;
          border:${act?'2px solid #0F140E':'1px solid rgba(255,255,255,.85)'};box-shadow:0 1px 3px rgba(0,0,0,.35)">${t.s}</div>
        <div style="width:1px;height:8px;background:${t.c}"></div>
      </div>
      ${(etiquetas&&zoomEtiq)?`<div class="pin-label" style="position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:2px">${esc(p.nombre)}</div>`:''}
      </div>`;
    L.marker([p.lat,p.lon],{icon:L.divIcon({className:'',html,iconSize:[0,0]})})
      .on('click',()=>detallePunto(p.id)).addTo(capaPuntos);
  });
  marcarYo();
}
function marcarYo(){
  if(!mapa||!capaYo) return;
  capaYo.clearLayers(); capaRuta.clearLayers();
  if(!S.pos) return;
  L.circle([S.pos.lat,S.pos.lon],{radius:S.pos.acc||10,color:'#0A6A70',weight:1,
    fillColor:'#0A6A70',fillOpacity:.12,dashArray:'3 3'}).addTo(capaYo);
  L.marker([S.pos.lat,S.pos.lon],{icon:L.divIcon({className:'',iconSize:[0,0],
    html:`<div style="width:16px;height:16px;border-radius:50%;background:#0F140E;border:3px solid #F6F7F3;
      box-shadow:0 1px 4px rgba(0,0,0,.4);transform:translate(-50%,-50%)"></div>`})}).addTo(capaYo);
  const d=S.puntos.find(p=>p.id===S.destinoId);
  if(d && !rutaActual) L.polyline([[S.pos.lat,S.pos.lon],[d.lat,d.lon]],
    {color:'#C41E5A',weight:2,dashArray:'7 5',opacity:.85}).addTo(capaRuta);
}
function encuadrar(){
  let b=null;
  const suma=x=>{ try{ const g=x.getBounds(); if(g.isValid()) b = b? b.extend(g) : L.latLngBounds(g.getSouthWest(),g.getNorthEast()); }catch(e){} };
  if(capaFincas && capaFincas.getLayers().length) suma(capaFincas);
  if(S.puntos.length) suma(L.featureGroup(S.puntos.map(p=>L.marker([p.lat,p.lon]))));
  if(!b || !b.isValid()){ aviso('Todavía no hay fincas ni puntos'); return; }
  mapa.fitBounds(b,{padding:[34,34],maxZoom:17});
  zoomEtiq = mapa.getZoom()>=15;
}

/* ---------------------------------------------------------------
   MAPA DE LA ZONA PARA USAR SIN SEÑAL
   Baja las teselas que cubren las fincas y las deja guardadas en el
   teléfono. Se hace una vez, con wifi. Después el fondo se ve igual
   sin datos.
   --------------------------------------------------------------- */
function bboxFincas(){
  let x0=180,y0=90,x1=-180,y1=-90;
  const w=c=>{ if(typeof c[0]==='number'){
      x0=Math.min(x0,c[0]); x1=Math.max(x1,c[0]);
      y0=Math.min(y0,c[1]); y1=Math.max(y1,c[1]);
    } else c.forEach(w); };
  if(S.fincas) S.fincas.features.forEach(f=>w(f.geometry.coordinates));
  S.puntos.forEach(p=>{ x0=Math.min(x0,p.lon); x1=Math.max(x1,p.lon);
                        y0=Math.min(y0,p.lat); y1=Math.max(y1,p.lat); });
  if(x0>x1) return null;
  const mx=(x1-x0)*0.06+0.005, my=(y1-y0)*0.06+0.005;
  return [x0-mx,y0-my,x1+mx,y1+my];
}
const tileX=(lon,z)=>Math.floor((lon+180)/360*Math.pow(2,z));
const tileY=(lat,z)=>{ const r=lat*Math.PI/180;
  return Math.floor((1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*Math.pow(2,z)); };

function listaTeselas(bb,zMin,zMax){
  const out=[];
  for(let z=zMin;z<=zMax;z++){
    const xa=tileX(bb[0],z), xb=tileX(bb[2],z);
    const ya=tileY(bb[3],z), yb=tileY(bb[1],z);
    for(let x=xa;x<=xb;x++) for(let y=ya;y<=yb;y++) out.push({z,x,y});
  }
  return out;
}

async function descargarZona(){
  const base=BASES[baseIdx];
  if(!base.url) return aviso('Elige primero un fondo (botón de capas)');
  if(!navigator.onLine) return aviso('Necesitas señal o wifi para descargar');
  const bb=bboxFincas();
  if(!bb) return aviso('No hay fincas ni puntos que cubrir');

  const zMax = 16, zMin = 11;
  const t = listaTeselas(bb,zMin,zMax);
  const mb = Math.round(t.length*28/1024);
  if(!confirm(`Descargar el fondo "${base.nombre}" de la zona de las fincas.\n\n`+
              `${t.length} piezas, cerca de ${mb} MB.\n`+
              `Hazlo con wifi. Después el mapa se ve sin señal.`)) return;

  let ok=0, fallo=0;
  const cache = await caches.open('rumbo-teselas');
  const total=t.length;
  aviso('Descargando 0 %…');

  for(let i=0;i<total;i+=6){
    await Promise.all(t.slice(i,i+6).map(async c=>{
      const url = base.url.replace('{z}',c.z).replace('{x}',c.x).replace('{y}',c.y);
      try{
        if(await cache.match(url)){ ok++; return; }
        const r = await fetch(url,{mode:'cors'});
        if(r.ok){ await cache.put(url,r.clone()); ok++; } else fallo++;
      }catch(e){ fallo++; }
    }));
    if(i%120===0) aviso('Descargando '+Math.round(i/total*100)+' %…');
  }
  aviso(`Listo: ${ok} piezas guardadas${fallo?', '+fallo+' fallaron':''}. Ya sirve sin señal.`);
}

function pintarLista(){
  if(S.vista!=='puntos' && !document.hidden) { /* aún así refrescamos distancias */ }
  const q=S.busca.toLowerCase();
  let ps=S.puntos.filter(p=>
    (S.filtro==='todos'||p.tipo===S.filtro) &&
    (!q || (p.nombre+' '+(p.finca||'')+' '+(p.notas||'')).toLowerCase().includes(q)));

  if(S.pos) ps=ps.map(p=>({...p,_d:distancia(S.pos.lat,S.pos.lon,p.lat,p.lon)}))
                 .sort((a,b)=>a._d-b._d);
  else ps=ps.sort((a,b)=>(a.finca||'').localeCompare(b.finca||'')||a.nombre.localeCompare(b.nombre));

  const cont=$('#lista');
  if(!ps.length){
    cont.innerHTML = S.puntos.length
      ? `<div class="empty"><h2>Ningún punto coincide</h2><p>Prueba con otro nombre o quita el filtro.</p></div>`
      : `<div class="empty"><h2>Aún no hay puntos</h2>
           <p>Agrega el primero con el botón <b>+</b>, o importa un archivo desde “Datos, respaldo y fincas”.</p></div>`;
    return;
  }
  let h='', grupo=null;
  ps.forEach(p=>{
    const g = S.pos? null : (p.finca||'Sin finca');
    if(g && g!==grupo){ grupo=g; h+=`<div class="grp">${esc(g)}</div>`; }
    const t=tipoDe(p.tipo);
    const [n,u]=fmtDist(p._d);
    const uv=ultimaVisita(p.id);
    h+=`<div class="item" data-id="${p.id}">
      <div class="ic" style="background:${t.c}">${t.s}</div>
      <div class="tx"><b>${esc(p.nombre)}</b><span>${uv
          ? `<i style="font-style:normal;color:${estadoDe(uv.estado).c};font-weight:700">${estadoDe(uv.estado).s}</i> ${fechaCorta(uv.cuando).slice(0,10)} · ${esc(p.finca||'sin finca')}`
          : esc(p.finca||'sin finca')+' · '+fmtCoord(p.lat,p.lon)}</span></div>
      <div class="d">${p._d!=null? n+' '+u : ''}</div></div>`;
  });
  if(S.pos) h=`<div class="grp">Más cerca primero</div>`+h;
  cont.innerHTML=h;
  cont.querySelectorAll('.item').forEach(el=>el.onclick=()=>detallePunto(el.dataset.id));
}

function descargar(nombre,texto,mime){
  const b=new Blob([texto],{type:mime||'application/json'});
  const u=URL.createObjectURL(b), a=document.createElement('a');
  a.href=u; a.download=nombre; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(u);a.remove();},1200);
}

    for(const {v,p} of porFinca[finca]){

        + (v.quien? ' · '+esc(v.quien) : '')
        + (v.lat!=null? ' · '+fmtCoord2(v.lat,v.lon)+' ±'+(v.acc||0)+' m' : ' · sin GPS')
        + (p? ' · punto en '+fmtCoord2(p.lat,p.lon) : '')
        + '</div>'
        + (v.obs? '<p>'+esc(v.obs)+'</p>' : '')
        + (imgs? '<div class="f">'+imgs+'</div>' : '')
        + '</div>';
    }
  }

  const doc = '<!doctype html><html lang="es"><meta charset="utf-8">'
    + '<meta name="viewport" content="width=device-width,initial-scale=1">'
    + '<title>Evidencias de campo — '+hoy()+'</title><style>'
    + 'body{font:15px/1.55 system-ui,-apple-system,Segoe UI,sans-serif;color:#14180F;'
    + 'max-width:820px;margin:0 auto;padding:26px 18px 60px}'
    + 'h1{font-size:23px;margin:0 0 4px}h2{font-size:17px;margin:30px 0 10px;'
    + 'padding-bottom:6px;border-bottom:2px solid #0A6A70;color:#0A6A70}'
    + '.sub{color:#5A6155;font-size:13px;margin:0 0 8px}'
    + '.v{border:1px solid #DDE1D6;border-radius:10px;padding:13px 15px;margin:11px 0;'
    + 'break-inside:avoid}'
    + '.cab{display:flex;justify-content:space-between;align-items:center;gap:10px}'
    + '.e{color:#fff;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;'
    + 'white-space:nowrap}'
    + '.m{font:12px ui-monospace,Menlo,monospace;color:#5A6155;margin-top:5px}'
    + '.v p{margin:9px 0 0;white-space:pre-wrap}'
    + '.f{display:flex;flex-wrap:wrap;gap:9px;margin-top:11px}'
    + '.f img{width:240px;border-radius:7px;border:1px solid #DDE1D6}'
    + '@media print{.v{border-color:#bbb}body{padding:0}}'
    + '</style><h1>Evidencias de campo</h1>'
    + '<p class="sub">Generado el '+fechaCorta(Date.now())
    + ' · '+S.visitas.length+' visitas registradas</p>'
    + cuerpo
    + '<p class="sub" style="margin-top:34px">Cada foto lleva escrito el punto, la fecha y la '
    + 'coordenada desde donde se tomó.</p></html>';

  descargar('evidencias-'+hoy()+'.html', doc, 'text/html');
  aviso('Informe listo. Ábrelo e imprímelo a PDF si lo necesitas.');
}

  const filas=[['nombre','tipo','finca','lat','lon','notas'].join(',')]

async function importarJSON(txt){
  let j; try{ j=JSON.parse(txt); }catch(e){ return aviso('El archivo no se pudo leer'); }

  /* archivo de vías: entra por el mismo botón de importar */
  if(j.rumboVias && j.vias && j.vias.lat){
    G = j.vias;
    try{ await Store.set('vias', G); }catch(e){}
    cerrarHoja(); refrescar();
    if(S.destinoId) recalcular(true);
    return aviso('Vías cargadas: '+G.lat.length+' cruces. Las rutas ya sirven.');
  }

  let nPtos=0, nFin=0;
  if(j.rumbo){
    if(Array.isArray(j.puntos)){ nPtos=fusionar(j.puntos); }
    if(Array.isArray(j.visitas)){
      /* fusionar por id: dos practicantes pueden traer visitas distintas
         del mismo punto y las dos tienen que sobrevivir */
      const hay=new Set(S.visitas.map(v=>v.id));
      j.visitas.forEach(v=>{ if(v&&v.id&&!hay.has(v.id)){ S.visitas.push(v); hay.add(v.id); } });
      guardarVisitas();
    }
    if(j.fincas){ S.fincas=j.fincas; nFin=j.fincas.features.length; }
  } else if(j.type==='FeatureCollection'){
    const pol=j.features.filter(f=>f.geometry&&/Polygon|LineString/.test(f.geometry.type));
    const pts=j.features.filter(f=>f.geometry&&f.geometry.type==='Point');
    if(pol.length){ S.fincas={type:'FeatureCollection',features:pol}; nFin=pol.length; }
    if(pts.length){
      nPtos=fusionar(pts.map(f=>{
        const p=f.properties||{};
        return {id:'p'+Math.random().toString(36).slice(2,10),
          nombre:p.nombre||p.NOMBRE||p.name||p.Name||'Punto',
          tipo:(String(p.tipo||p.TIPO||'').toLowerCase().match(/pozo|vertim|bocatoma|residuo|refor|fauna/)||['otro'])[0]
               .replace('vertim','vertimiento').replace('residuo','residuos').replace('refor','reforestacion'),
          finca:p.finca||p.FINCA||p.Finca||'',
          lat:f.geometry.coordinates[1], lon:f.geometry.coordinates[0],
          notas:p.notas||p.NOTAS||p.descripcion||'', creado:new Date().toISOString()};
      }));
    }
  } else return aviso('Formato no reconocido');
  await guardarPuntos(); await guardarFincas(); cerrarHoja(); refrescar();
  aviso(`Importado: ${nPtos} puntos, ${nFin} fincas`);
}
/* Id derivado de nombre+finca: reimportar la planilla corregida actualiza
   el punto en vez de crear uno nuevo, aunque la coordenada haya cambiado. */
function idEstable(nombre,finca){
  const base=(String(nombre)+'|'+String(finca)).toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9|]+/g,'');
  let h=5381; for(let i=0;i<base.length;i++) h=((h*33)^base.charCodeAt(i))>>>0;
  return 'c'+h.toString(36);
}
function fusionar(nuevos){
  let n=0;
  nuevos.forEach(p=>{
    if(typeof p.lat!=='number'||typeof p.lon!=='number') return;
    const igual=S.puntos.find(x=>x.id===p.id ||
      (x.nombre===p.nombre && Math.abs(x.lat-p.lat)<1e-6 && Math.abs(x.lon-p.lon)<1e-6));
    if(igual) Object.assign(igual,p,{id:igual.id}); else { S.puntos.push(p); }
    n++;
  });
  return n;
}
async function importarCSV(txt){
  const lineas=txt.replace(/^\ufeff/,'').split(/\r?\n/).filter(l=>l.trim());
  if(lineas.length<2) return aviso('El CSV está vacío');
  const sep = (lineas[0].match(/;/g)||[]).length > (lineas[0].match(/,/g)||[]).length ? ';' : ',';
  const corta = l => { const o=[]; let c='',q=false;
    for(let i=0;i<l.length;i++){ const ch=l[i];
      if(q){ if(ch==='"'){ if(l[i+1]==='"'){c+='"';i++;} else q=false; } else c+=ch; }
      else if(ch==='"') q=true; else if(ch===sep){ o.push(c); c=''; } else c+=ch; }
    o.push(c); return o.map(s=>s.trim()); };
  const cab=corta(lineas[0]).map(h=>h.toLowerCase().replace(/[^a-z]/g,''));
  const idx=n=>cab.findIndex(h=>h.startsWith(n));
  const iN=idx('nombre')>=0?idx('nombre'):idx('name'), iT=idx('tipo'), iF=idx('finca'),
        iLa=idx('lat'), iLo=idx('lon')>=0?idx('lon'):idx('long'), iO=idx('nota')>=0?idx('nota'):idx('obs');
  if(iLa<0||iLo<0) return aviso('El CSV necesita columnas lat y lon');
  const nuevos=[];
  lineas.slice(1).forEach(l=>{
    const v=corta(l);
    let lat=parseCoord(v[iLa]), lon=parseCoord(v[iLo]);
    if(isNaN(lat)||isNaN(lon)) return;
    const r=revisarCoord(lat,lon);
    const tipoTxt=String(iT>=0?v[iT]:'').toLowerCase();
    const tipo=Object.keys(TIPOS).find(k=>tipoTxt.startsWith(k.slice(0,5)))||'otro';
    const nom=(iN>=0?v[iN]:'')||'Punto '+(nuevos.length+1);
    const fin=iF>=0?v[iF]:'';
    nuevos.push({id:idEstable(nom,fin),
      nombre:nom, tipo,
      finca:fin, lat:r.lat, lon:r.lon, notas:iO>=0?v[iO]:'',
      creado:new Date().toISOString()});
  });
  if(!nuevos.length) return aviso('No se encontraron coordenadas válidas');
  const n=fusionar(nuevos);
  await guardarPuntos(); cerrarHoja(); refrescar(); aviso(`${n} puntos importados`);
}

(async function inicio(){
  await Store.open();
  S.puntos = (await Store.get('puntos')) || [];
  S.fincas = (await Store.get('fincas')) || null;
  if(!S.fincas || !S.fincas.features || !S.fincas.features.length){
    S.fincas = FINCAS_BASE; guardarFincas();
  }
  S.visitas = (await Store.get('visitas')) || [];
  S.quien   = (await Store.get('quien')) || '';
  cargarGrafo();
  S.destinoId = (await Store.get('destino')) || null;
  iniciarMapa();
  refrescar();
  iniciarGPS();
  if(!(typeof DeviceOrientationEvent!=='undefined' && DeviceOrientationEvent.requestPermission)) escucharBrujula();
  irA('ir');
  setInterval(()=>{ if(S.pos) pintarIr(); },1000);
  if('serviceWorker' in navigator && location.protocol.startsWith('http')){
    /* updateViaCache:'none' — sin esto el navegador puede servir el sw.js
       viejo desde su propia caché y la app se queda congelada para siempre. */
    navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{
      regSW = reg;
      reg.addEventListener('updatefound',()=>{
        const nuevo = reg.installing;
        if(!nuevo) return;
        nuevo.addEventListener('statechange',()=>{
          /* hay versión nueva lista y ya había una controlando: avisar */
          if(nuevo.state==='installed' && navigator.serviceWorker.controller)
            mostrarAvisoActualizar(nuevo);
        });
      });
      /* al abrir, preguntar siempre si hay algo nuevo */
      reg.update().catch(()=>{});
    }).catch(()=>{});
    /* El SW nuevo se activa solo. Cuando toma el control, recargamos una
       vez para que la pantalla corresponda a la versión que ya manda. */
    navigator.serviceWorker.addEventListener('controllerchange',()=>{
      if(recargando) return; recargando=true;
      setTimeout(()=>location.reload(),300);
    });
  }
})();
